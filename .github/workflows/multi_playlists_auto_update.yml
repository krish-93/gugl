name: Auto Update Multi Playlists

on:
  schedule:
    - cron: '*/30 * * * *' # Runs every 30 minutes
  workflow_dispatch: # Allows manual trigger

permissions:
  contents: write

jobs:
  update-multi-m3u:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cryptography

      - name: Run Multi Playlist Generator Script
        run: python generate_multi_playlists.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add mixed_live.m3u
          # Commit only if there are changes
          git commit -m "Auto-update Mixed Live playlist: $(date -u)" || echo "No changes to commit"
          # పుష్ చేయడానికి ముందు పుల్ చేయాలి (ఎర్రర్ రాకుండా)
          git pull --rebase origin main
          git push 
